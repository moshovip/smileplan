# =====================================================================
#  Скилл статей — конфиг SmilePlan
#  Собран автопилотом на основе business/ и README проекта.
#  Проверь и поправь разделы, помеченные # уточнить
# =====================================================================

project:
  domain: "moshovip.github.io/smileplan"
  content_path: "/blog"
  # Когда появится отдельный домен — поменять на smileplan.ru или аналог

audience:
  profile: >
    Частный врач-стоматолог, 28–45 лет, ведёт практику в 1-5 кресел.
    Работает в тетради или Excel, слышал про MIS но не пробовал — или пробовал
    дорогие (Инфодент, 1С) и бросил. Ищет простой инструмент «прямо сейчас»,
    без регистрации, без сложного обучения. Боится потерять данные пациентов.
    Хочет навести порядок в расписании и медкартах, не тратя на это часы.
    Читает на русском, иногда аналогично пишет по-русски с ошибками — принимаем.
  jargon_level: "low"
  # Читатели знают слова «медкарта», «прием», «план лечения», но не «MIS», «PWA».
  # Пишем на понятном языке врача, не айтишника.

voice:
  source: "./voice-samples"
  # Положи сюда 3–5 статей/постов в своём стиле для тон-матчинга.
  # Пока папки нет — тон будет нейтральным профессиональным.
  forbidden:
    - "в современном мире"
    - "не секрет, что"
    - "на сегодняшний день"
    - "следует отметить"
    - "в данной статье"
    - "подводя итог"
    - "как известно"
    - "уникальный"          # перегружен, не несёт смысла
    - "инновационный"       # аналогично
    - "экосистема"          # не уместно для стоматологов

cta:
  offer: "SmilePlan — бесплатная электронная MIS для стоматологов. Работает в браузере, без установки."
  url: "https://moshovip.github.io/smileplan"

editorial:
  banned_words:
    - "персональные данные пациентов"   # юр. чувствительность 152-ФЗ
    - "персональные данные"             # то же
    - "HIPAA"                           # не применимо в РФ, вводит в заблуждение
    # Медицинские термины с осторожностью:
    - "лечить"                          # заменять на «помочь с лечением», «вести учёт лечения»
    # SmilePlan не оказывает медпомощь, он ведёт документацию

cms:
  adapter: "manual"
  # Статья публикуется в папку stateinik-engine/content/guides/ как .mdx файл
  # и затем подхватывается движком при следующем деплое.
  # Когда статейник-движок задеплоен — сменить на custom с адаптером к его API.

tools:
  originality:
    max_cosine: 0.60
    ngram_n: 5
    max_ngram: 0.30
  cadence:
    max_per_1k: 3.0
  read_aloud:
    max_sentence_words: 40
  structure:
    min_internal_links: 1

image:
  tool: ""
  format: "webp"
  dest: "./stateinik-engine/stateinik-engine/public/images/articles"
  ratio: "16:9"
  max_kb: 200
