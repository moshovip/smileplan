# =====================================================================
#  Скилл статей - конфиг проекта
#  Единственное место, где живёт ваша специфика. Методология, инструменты
#  и чек-листы читают этот файл и работают на ваших данных.
#
#  Заполнить можно двумя способами:
#   1. Запустить AUTOPILOT.md - он просканит проект, задаст 6 вопросов и
#      заполнит этот файл за вас.
#   2. Скопировать в config.yaml и заполнить руками по комментариям ниже.
# =====================================================================

project:
  # Домен, на котором публикуются статьи (без https://).
  domain: "example.com"
  # Путь к разделу статей: /blog, /guides, /articles, /journal.
  content_path: "/blog"

audience:
  # 1-2 абзаца: кто читатель, что он уже знает, чего боится, что хочет получить.
  # Чем конкретнее - тем точнее заголовки и тон. Это НЕ "все люди".
  profile: >
    Кто ваш читатель. Например: владельцы малого бизнеса, которые ведут учёт
    сами, боятся ошибиться в отчётности и ищут пошаговые объяснения без
    бухгалтерского жаргона.
  # low  = читатель не знает терминов ниши, ищет действие ("как вернуть налог")
  # high = читатель эксперт, ищет по терминам
  jargon_level: "low"

voice:
  # Папка с 3-5 вашими текстами (статьи, расшифровки, посты) для тон-матчинга.
  # Агент читает их, чтобы статья звучала как вы, а не как ИИ-копирайтер.
  # Если образцов нет - оставьте пустым, тон возьмётся нейтральный.
  source: "./voice-samples"
  # Фразы и слова, которые звучат не по-вашему или выдают шаблон. Список строк.
  forbidden:
    - "в современном мире"
    - "не секрет, что"

cta:
  # Что вы продаёте: продукт, подписку, лид-магнит, услугу. Одной фразой.
  offer: "Ваш продукт или услуга - то, к чему статья ведёт читателя"
  # Ссылка на оффер (с UTM-метками, если используете).
  url: "https://example.com/offer"

editorial:
  # Ваш стоп-словарь: бренд-табу, юридические ограничения вашей ниши,
  # лицензируемые термины, англицизмы с русским аналогом. Список строк.
  # Методология проверяет текст против этого списка (Этапы 8 и 14, ручной grep).
  banned_words: []

cms:
  # Как публикуем статью. Адаптер определяет Этапы 9 и 12.
  #   manual    - агент кладёт готовый файл, вы публикуете руками
  #   wordpress - REST API WordPress
  #   ghost     - Admin API Ghost
  #   notion    - Notion API
  #   custom    - своя реализация адаптера в tools/publish.py
  adapter: "manual"

tools:
  # Пороги для инструментов проверки качества (tools/). Можно не трогать.
  originality:
    max_cosine: 0.60     # выше - текст слишком похож на уже опубликованное
    ngram_n: 5           # длина словесных n-грамм для поиска совпадений
    max_ngram: 0.30      # макс. доля совпадающих n-грамм 0..1 (выше = дословное копирование)
  cadence:
    max_per_1k: 3.0      # плотность AI-маркеров на 1000 слов (выше - переписать)
  read_aloud:
    max_sentence_words: 40   # длиннее - предложение спотыкается при чтении вслух
  structure:
    min_internal_links: 1    # минимум внутренних ссылок на ваши материалы

image:
  # Hero-иллюстрация (Этап 6b, опционально). Если не нужна - оставьте tool пустым.
  tool: ""               # имя вашего image-инструмента или пусто = SKIP
  format: "webp"         # формат файла обложки: webp / avif / jpg
  dest: "./images"       # куда складывать готовые обложки (путь или бакет)
  ratio: "16:9"
  max_kb: 200
